<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
  <title>BarberSaaS</title>

  <!-- Firebase Modular SDK -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
      }
    }
  </script>

  <!-- Chart.js (for owner dashboard) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    /* ── Global reset & variables ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      background: #0b0d10;
      color: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0;
      margin: 0;
    }
    :root {
      --bg: #0b0d10;
      --bg2: #12151b;
      --card: #1a1f27;
      --border: #2a3440;
      --text: #f0f2f5;
      --text2: #a0b0c4;
      --muted: #6a7b8f;
      --accent: #6c8cff;
      --accent-dim: rgba(108, 140, 255, 0.15);
      --green: #2ecc71;
      --red: #e74c5e;
      --orange: #f39c12;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    button {
      cursor: pointer;
      border: none;
      outline: none;
      background: none;
      color: inherit;
      font-family: inherit;
    }
    input,
    select,
    textarea {
      font-family: inherit;
      outline: none;
      border: none;
      background: none;
      color: inherit;
    }
    /* ── Layout ── */
    .page {
      display: none;
      width: 100%;
      min-height: 100vh;
    }
    .page.active {
      display: flex;
      flex-direction: column;
    }
    .container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
    }
    /* ── Cards ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .card-header h3 {
      font-size: 18px;
      font-weight: 600;
    }
    .btn {
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 500;
      font-size: 14px;
      transition: 0.2s;
      border: 1px solid var(--border);
      color: var(--text2);
    }
    .btn:hover {
      background: var(--border);
      color: var(--text);
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-primary:hover {
      background: #5a7ae8;
    }
    .btn-green {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }
    .btn-danger {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }
    /* ── Forms ── */
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      margin-bottom: 4px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 600px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }
    /* ── Toast ── */
    #toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 400px;
      width: 100%;
      pointer-events: none;
    }
    .toast {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
      animation: slideUp 0.3s ease;
    }
    .toast.success {
      border-left: 4px solid var(--green);
    }
    .toast.error {
      border-left: 4px solid var(--red);
    }
    .toast.info {
      border-left: 4px solid var(--accent);
    }
    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    /* ── Utilities ── */
    .flex {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .text-muted {
      color: var(--muted);
    }
    .text-center {
      text-align: center;
    }
    .mt-20 {
      margin-top: 20px;
    }
    .mb-20 {
      margin-bottom: 20px;
    }
    .w-full {
      width: 100%;
    }
    .badge {
      display: inline-block;
      padding: 2px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-active {
      background: var(--green);
      color: #fff;
    }
    .badge-pending {
      background: var(--orange);
      color: #fff;
    }
    .badge-suspended {
      background: var(--red);
      color: #fff;
    }
    /* ── Tables ── */
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    table th {
      text-align: left;
      padding: 10px 12px;
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }
    table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text2);
    }
    /* ── Navigation (owner dashboard) ── */
    .dashboard-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .dashboard-nav a {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      color: var(--text2);
      transition: 0.2s;
      cursor: pointer;
    }
    .dashboard-nav a:hover,
    .dashboard-nav a.active {
      background: var(--accent-dim);
      color: var(--accent);
    }
    /* ── Public shop ── */
    .shop-hero {
      text-align: center;
      padding: 40px 20px;
    }
    .shop-hero img {
      max-width: 160px;
      border-radius: 50%;
      border: 2px solid var(--border);
    }
    .shop-hero h1 {
      font-size: 32px;
      margin-top: 16px;
    }
    .shop-hero p {
      color: var(--text2);
      max-width: 500px;
      margin: 10px auto;
    }
    .service-card,
    .barber-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .service-card .price {
      color: var(--accent);
      font-weight: 600;
    }
    .booking-form {
      max-width: 500px;
      margin: 0 auto;
    }
    /* ── Responsive ── */
    @media (max-width: 768px) {
      .container {
        padding: 12px;
      }
      .dashboard-nav a {
        font-size: 13px;
        padding: 6px 12px;
      }
    }
  </style>
</head>

<body>

  <!-- ─── TOAST CONTAINER ─── -->
  <div id="toast-container"></div>

  <!-- ─── PAGE: LOGIN ─── -->
  <div id="page-login" class="page active">
    <div class="container" style="max-width:400px;margin:80px auto;">
      <div class="card" style="padding:40px;">
        <h2 style="text-align:center;margin-bottom:8px;">✂ BarberSaaS</h2>
        <p class="text-center text-muted" style="margin-bottom:24px;">Owner Login</p>
        <div id="loginError" style="color:var(--red);margin-bottom:12px;display:none;"></div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="owner@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" />
        </div>
        <button class="btn btn-primary w-full" id="loginBtn">Sign In</button>
        <p class="text-center text-muted mt-20" style="font-size:14px;">
          Don't have an account? <a href="#" id="goToSignup">Create one</a>
        </p>
      </div>
    </div>
  </div>

  <!-- ─── PAGE: SIGNUP ─── -->
  <div id="page-signup" class="page">
    <div class="container" style="max-width:400px;margin:80px auto;">
      <div class="card" style="padding:40px;">
        <h2 style="text-align:center;margin-bottom:8px;">Create Account</h2>
        <p class="text-center text-muted" style="margin-bottom:24px;">Start your barber business</p>
        <div id="signupError" style="color:var(--red);margin-bottom:12px;display:none;"></div>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="signupName" placeholder="Ahmed Mohamed" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signupEmail" placeholder="owner@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="min 6 characters" />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="signupPhone" placeholder="+201234567890" />
        </div>
        <button class="btn btn-primary w-full" id="signupBtn">Sign Up</button>
        <p class="text-center text-muted mt-20" style="font-size:14px;">
          Already have an account? <a href="#" id="goToLogin">Sign In</a>
        </p>
      </div>
    </div>
  </div>

  <!-- ─── PAGE: ONBOARDING (Shop Creation) ─── -->
  <div id="page-onboarding" class="page">
    <div class="container" style="max-width:700px;">
      <div class="card">
        <div class="flex-between">
          <h2>🏪 Create Your Shop</h2>
          <span id="onboardingStep" class="text-muted">Step 1 / 10</span>
        </div>
        <div id="onboardingContent">
          <!-- Steps rendered dynamically -->
        </div>
      </div>
    </div>
  </div>

  <!-- ─── PAGE: OWNER DASHBOARD ─── -->
  <div id="page-dashboard" class="page">
    <div class="container">
      <div class="flex-between" style="margin-bottom:16px;">
        <h2 id="dashboardShopName">My Shop</h2>
        <div class="flex">
          <span id="shopStatusBadge" class="badge badge-pending">draft</span>
          <button class="btn btn-primary" id="logoutBtn" style="margin-left:12px;">Logout</button>
        </div>
      </div>
      <!-- Navigation -->
      <nav class="dashboard-nav" id="dashboardNav">
        <a data-section="overview" class="active">Overview</a>
        <a data-section="services">Services</a>
        <a data-section="barbers">Barbers</a>
        <a data-section="bookings">Bookings</a>
        <a data-section="customers">Customers</a>
        <a data-section="reviews">Reviews</a>
        <a data-section="gallery">Gallery</a>
        <a data-section="hours">Hours</a>
        <a data-section="holidays">Holidays</a>
        <a data-section="subscription">Subscription</a>
        <a data-section="qr">QR</a>
        <a data-section="settings">Settings</a>
      </nav>
      <!-- Sections -->
      <div id="dashboardContent">
        <!-- Each section rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- ─── PAGE: PUBLIC SHOP ─── -->
  <div id="page-public" class="page">
    <div id="publicContent" class="container">
      <!-- Rendered dynamically -->
    </div>
  </div>

  <!-- ─── SCRIPTS ─── -->
  <script type="module">
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // IMPORTS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    import { initializeApp } from 'firebase/app';
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut,
      updateProfile
    } from 'firebase/auth';
    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      getDocs,
      addDoc,
      setDoc,
      updateDoc,
      deleteDoc,
      query,
      where,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp,
      runTransaction,
      writeBatch,
      Timestamp,
      increment,
      getCountFromServer
    } from 'firebase/firestore';

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // CONFIG
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const firebaseConfig = {
      apiKey: "AIzaSyA0IWiY-tI30LX2PS9G2T2gEiBAEd4GqzU",
      authDomain: "salons-feee4.firebaseapp.com",
      projectId: "salons-feee4",
      storageBucket: "salons-feee4.firebasestorage.app",
      messagingSenderId: "601094041409",
      appId: "1:601094041409:web:d03a02de993fbb203cbbc0",
      measurementId: "G-GP53GSCW0C"
    };
    const CLOUDINARY = { cloudName: 'deaevfmvm', uploadPreset: 'salons1' };

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // INIT
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // DOM REFS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);
    const toastContainer = $('#toast-container');

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // HELPERS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function showToast(msg, type = 'info', duration = 3500) {
      const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-circle-info' };
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.innerHTML = `<span><i class="fas ${icons[type]||icons.info}"></i></span><span>${msg}</span><span onclick="this.parentElement.remove()" style="margin-left:auto;cursor:pointer;">&times;</span>`;
      toastContainer.appendChild(el);
      setTimeout(() => { if (el.parentNode) el.remove(); }, duration);
    }
    window.showToast = showToast;

    function switchPage(pageId) {
      $$('.page').forEach(p => p.classList.remove('active'));
      const target = document.getElementById(pageId);
      if (target) target.classList.add('active');
    }

    function formatDate(d) {
      if (!d) return 'N/A';
      if (d.toDate) d = d.toDate();
      return d.toLocaleDateString();
    }

    function formatTime(d) {
      if (!d) return 'N/A';
      if (d.toDate) d = d.toDate();
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // ─── Cloudinary upload ───
    async function uploadToCloudinary(file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY.uploadPreset);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/image/upload`, {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || 'Upload failed');
      return { url: data.secure_url, publicId: data.public_id };
    }

    // ─── Slug generation ───
    function generateSlug(name) {
      return name.toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '')
        .substring(0, 60);
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // STATE
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    let currentUser = null;
    let currentShop = null; // shop doc data
    let currentShopId = null;
    let currentRole = null;
    let unsubscribers = [];

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // AUTH
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        // fetch user doc
        try {
          const userDoc = await getDoc(doc(db, 'users', user.uid));
          if (userDoc.exists()) {
            const data = userDoc.data();
            currentRole = data.role || 'customer';
            currentShopId = data.shopId || null;
            // if shopId, load shop
            if (currentShopId) {
              const shopSnap = await getDoc(doc(db, 'shops', currentShopId));
              if (shopSnap.exists()) {
                currentShop = { id: shopSnap.id, ...shopSnap.data() };
              }
            }
            // redirect
            if (currentRole === 'shop_owner') {
              if (!currentShopId) {
                // no shop -> onboarding
                switchPage('page-onboarding');
                renderOnboarding();
              } else {
                switchPage('page-dashboard');
                renderDashboard();
              }
            } else {
              // not owner -> public? For now, just show message
              showToast('You are not a shop owner.', 'error');
              switchPage('page-login');
            }
          } else {
            // user doc missing -> create it?
            // For simplicity, we assume it exists; but we can create on signup.
          }
        } catch (e) {
          console.error(e);
          showToast('Error loading user', 'error');
        }
      } else {
        currentUser = null;
        currentRole = null;
        currentShop = null;
        currentShopId = null;
        unsubscribers.forEach(fn => fn());
        unsubscribers = [];
        switchPage('page-login');
      }
    });

    // ─── Login ───
    $('#loginBtn').addEventListener('click', async () => {
      const email = $('#loginEmail').value.trim();
      const password = $('#loginPassword').value;
      const errEl = $('#loginError');
      errEl.style.display = 'none';
      if (!email || !password) { errEl.textContent = 'Please fill all fields.';
        errEl.style.display = 'block'; return; }
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (e) {
        errEl.textContent = e.message;
        errEl.style.display = 'block';
      }
    });

    // ─── Signup ───
    $('#signupBtn').addEventListener('click', async () => {
      const name = $('#signupName').value.trim();
      const email = $('#signupEmail').value.trim();
      const password = $('#signupPassword').value;
      const phone = $('#signupPhone').value.trim();
      const errEl = $('#signupError');
      errEl.style.display = 'none';
      if (!name || !email || !password) { errEl.textContent = 'All fields required.';
        errEl.style.display = 'block'; return; }
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        // Update profile
        await updateProfile(cred.user, { displayName: name });
        // Create user document with role shop_owner
        await setDoc(doc(db, 'users', cred.user.uid), {
          name,
          email,
          phone: phone || '',
          role: 'shop_owner',
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });
        showToast('Account created! Starting onboarding...', 'success');
        // onAuthStateChanged will redirect to onboarding
      } catch (e) {
        errEl.textContent = e.message;
        errEl.style.display = 'block';
      }
    });

    // ─── Logout ───
    $('#logoutBtn').addEventListener('click', async () => {
      await signOut(auth);
      showToast('Logged out', 'info');
    });

    // ─── Toggle pages ───
    $('#goToSignup').addEventListener('click', (e) => { e.preventDefault();
      switchPage('page-signup'); });
    $('#goToLogin').addEventListener('click', (e) => { e.preventDefault();
      switchPage('page-login'); });

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // ONBOARDING
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const onboardingSteps = [
      { id: 'info', label: 'Shop Info' },
      { id: 'logo', label: 'Logo' },
      { id: 'cover', label: 'Cover' },
      { id: 'services', label: 'Services' },
      { id: 'hours', label: 'Hours' },
      { id: 'barbers', label: 'Barbers' },
      { id: 'gallery', label: 'Gallery' },
      { id: 'whatsapp', label: 'WhatsApp' },
      { id: 'location', label: 'Location' },
      { id: 'theme', label: 'Theme' },
    ];
    let onboardingData = {};
    let onboardingIndex = 0;

    function renderOnboarding() {
      const container = $('#onboardingContent');
      const step = onboardingSteps[onboardingIndex];
      if (!step) {
        // finish -> create shop
        finishOnboarding();
        return;
      }
      $('#onboardingStep').textContent = `Step ${onboardingIndex+1} / ${onboardingSteps.length}`;
      let html = '';
      html += `<h3>${step.label}</h3>`;
      switch (step.id) {
        case 'info':
          html += `
            <div class="form-group"><label>Shop Name *</label><input type="text" id="onbName" placeholder="Ahmed Barber" /></div>
            <div class="form-group"><label>Description</label><textarea id="onbDesc" placeholder="We provide premium barber services..."></textarea></div>
            <div class="form-group"><label>Phone</label><input type="tel" id="onbPhone" placeholder="+201234567890" /></div>
            <div class="form-group"><label>Country</label><input type="text" id="onbCountry" placeholder="Egypt" /></div>
            <div class="form-group"><label>Currency</label><select id="onbCurrency"><option value="USD">USD</option><option value="EGP">EGP</option><option value="EUR">EUR</option></select></div>
            <div class="form-group"><label>Timezone</label><input type="text" id="onbTz" placeholder="Africa/Cairo" value="Africa/Cairo" /></div>
          `;
          break;
        case 'logo':
          html += `
            <p class="text-muted">Upload your shop logo (recommended: square, max 2MB)</p>
            <input type="file" id="onbLogo" accept="image/*" />
            <div id="onbLogoPreview" style="margin-top:10px;"></div>
          `;
          break;
        case 'cover':
          html += `
            <p class="text-muted">Upload a cover image (recommended: 1200x400, max 5MB)</p>
            <input type="file" id="onbCover" accept="image/*" />
            <div id="onbCoverPreview" style="margin-top:10px;"></div>
          `;
          break;
        case 'services':
          html += `
            <p class="text-muted">Add your services (at least one)</p>
            <div id="onbServicesList"></div>
            <div class="grid-2">
              <div class="form-group"><label>Service Name</label><input type="text" id="onbServiceName" placeholder="Haircut" /></div>
              <div class="form-group"><label>Price</label><input type="number" id="onbServicePrice" placeholder="15.00" step="0.01" /></div>
            </div>
            <div class="form-group"><label>Duration (minutes)</label><input type="number" id="onbServiceDuration" placeholder="30" /></div>
            <button class="btn btn-primary" id="onbAddService">+ Add Service</button>
          `;
          break;
        case 'hours':
          html += `
            <p class="text-muted">Set your working hours for each day</p>
            <div id="onbHoursContainer"></div>
          `;
          break;
        case 'barbers':
          html += `
            <p class="text-muted">Add your barbers (optional)</p>
            <div id="onbBarbersList"></div>
            <div class="grid-2">
              <div class="form-group"><label>Barber Name</label><input type="text" id="onbBarberName" placeholder="John" /></div>
              <div class="form-group"><label>Phone</label><input type="text" id="onbBarberPhone" placeholder="+201234567890" /></div>
            </div>
            <div class="form-group"><label>Bio</label><textarea id="onbBarberBio" placeholder="Experienced barber..."></textarea></div>
            <button class="btn btn-primary" id="onbAddBarber">+ Add Barber</button>
          `;
          break;
        case 'gallery':
          html += `
            <p class="text-muted">Upload gallery images (optional)</p>
            <input type="file" id="onbGallery" accept="image/*" multiple />
            <div id="onbGalleryPreview" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"></div>
          `;
          break;
        case 'whatsapp':
          html += `
            <div class="form-group"><label>WhatsApp Number (with country code)</label><input type="tel" id="onbWhatsapp" placeholder="+201234567890" /></div>
            <p class="text-muted">Customers will contact you via WhatsApp.</p>
          `;
          break;
        case 'location':
          html += `
            <div class="form-group"><label>Address</label><textarea id="onbAddress" placeholder="123 Main St, Cairo"></textarea></div>
            <button class="btn btn-primary" id="onbGetLocation">Get Current Location</button>
            <div id="onbLocationResult" class="text-muted" style="margin-top:8px;"></div>
          `;
          break;
        case 'theme':
          html += `
            <p class="text-muted">Choose a theme for your public website</p>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <button class="btn" data-theme="dark">Dark Luxury</button>
              <button class="btn" data-theme="minimal">Modern Minimal</button>
              <button class="btn" data-theme="classic">Classic Barber</button>
              <button class="btn" data-theme="premium">Premium Black</button>
            </div>
            <div class="form-group"><label>Primary Color</label><input type="color" id="onbPrimary" value="#6c8cff" /></div>
            <div class="form-group"><label>Secondary Color</label><input type="color" id="onbSecondary" value="#1a1f27" /></div>
          `;
          break;
      }
      html += `
        <div style="display:flex;justify-content:space-between;margin-top:20px;">
          <button class="btn" id="onbPrev" ${onboardingIndex===0?'disabled':''}>Previous</button>
          <button class="btn btn-primary" id="onbNext">${onboardingIndex===onboardingSteps.length-1?'Finish':'Next'}</button>
        </div>
      `;
      container.innerHTML = html;
      // attach events
      document.getElementById('onbNext').addEventListener('click', () => {
        // collect data based on step
        collectOnboardingData(step.id);
        onboardingIndex++;
        renderOnboarding();
      });
      const prevBtn = document.getElementById('onbPrev');
      if (prevBtn) prevBtn.addEventListener('click', () => {
        onboardingIndex--;
        renderOnboarding();
      });
      // specific step handlers
      handleOnboardingStep(step.id);
    }

    function collectOnboardingData(stepId) {
      switch (stepId) {
        case 'info':
          onboardingData.name = $('#onbName').value.trim();
          onboardingData.description = $('#onbDesc').value.trim();
          onboardingData.phone = $('#onbPhone').value.trim();
          onboardingData.country = $('#onbCountry').value.trim();
          onboardingData.currency = $('#onbCurrency').value;
          onboardingData.timezone = $('#onbTz').value.trim();
          break;
        case 'logo':
          // file handled separately
          break;
        case 'cover':
          break;
        case 'services':
          // services array already built
          break;
        case 'hours':
          // hours collected from inputs
          break;
        case 'barbers':
          break;
        case 'gallery':
          break;
        case 'whatsapp':
          onboardingData.whatsapp = $('#onbWhatsapp').value.trim();
          break;
        case 'location':
          onboardingData.address = $('#onbAddress').value.trim();
          break;
        case 'theme':
          onboardingData.theme = {
            primary: $('#onbPrimary').value,
            secondary: $('#onbSecondary').value
          };
          break;
      }
    }

    function handleOnboardingStep(stepId) {
      // service adding
      if (stepId === 'services') {
        if (!onboardingData.services) onboardingData.services = [];
        renderOnbServices();
        document.getElementById('onbAddService').addEventListener('click', () => {
          const name = $('#onbServiceName').value.trim();
          const price = parseFloat($('#onbServicePrice').value);
          const duration = parseInt($('#onbServiceDuration').value);
          if (!name || isNaN(price) || isNaN(duration)) { showToast('Fill all fields', 'error'); return; }
          onboardingData.services.push({ name, price, duration });
          $('#onbServiceName').value = '';
          $('#onbServicePrice').value = '';
          $('#onbServiceDuration').value = '';
          renderOnbServices();
        });
      }
      if (stepId === 'barbers') {
        if (!onboardingData.barbers) onboardingData.barbers = [];
        renderOnbBarbers();
        document.getElementById('onbAddBarber').addEventListener('click', () => {
          const name = $('#onbBarberName').value.trim();
          const phone = $('#onbBarberPhone').value.trim();
          const bio = $('#onbBarberBio').value.trim();
          if (!name) { showToast('Name is required', 'error'); return; }
          onboardingData.barbers.push({ name, phone, bio });
          $('#onbBarberName').value = '';
          $('#onbBarberPhone').value = '';
          $('#onbBarberBio').value = '';
          renderOnbBarbers();
        });
      }
      if (stepId === 'hours') {
        const days = ['Saturday', 'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
        let html = '';
        days.forEach(d => {
          html += `
            <div class="flex" style="margin-bottom:8px;">
              <span style="width:100px;">${d}</span>
              <input type="checkbox" id="hour_${d}_enabled" checked />
              <label>Open</label>
              <input type="time" id="hour_${d}_open" value="09:00" />
              <input type="time" id="hour_${d}_close" value="21:00" />
            </div>
          `;
        });
        document.getElementById('onbHoursContainer').innerHTML = html;
      }
      if (stepId === 'logo') {
        document.getElementById('onbLogo').addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          try {
            const result = await uploadToCloudinary(file);
            onboardingData.logoUrl = result.url;
            onboardingData.logoPublicId = result.publicId;
            document.getElementById('onbLogoPreview').innerHTML = `<img src="${result.url}" style="max-width:120px;border-radius:8px;" />`;
          } catch (err) { showToast('Upload failed: '+err.message, 'error'); }
        });
      }
      if (stepId === 'cover') {
        document.getElementById('onbCover').addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          try {
            const result = await uploadToCloudinary(file);
            onboardingData.coverUrl = result.url;
            onboardingData.coverPublicId = result.publicId;
            document.getElementById('onbCoverPreview').innerHTML = `<img src="${result.url}" style="max-width:200px;border-radius:8px;" />`;
          } catch (err) { showToast('Upload failed: '+err.message, 'error'); }
        });
      }
      if (stepId === 'gallery') {
        onboardingData.gallery = onboardingData.gallery || [];
        document.getElementById('onbGallery').addEventListener('change', async (e) => {
          const files = e.target.files;
          for (const file of files) {
            try {
              const result = await uploadToCloudinary(file);
              onboardingData.gallery.push({ url: result.url, publicId: result.publicId });
              const preview = document.getElementById('onbGalleryPreview');
              const img = document.createElement('img');
              img.src = result.url;
              img.style.maxWidth = '80px';
              img.style.borderRadius = '8px';
              preview.appendChild(img);
            } catch (err) { showToast('Upload failed: '+err.message, 'error'); }
          }
        });
      }
      if (stepId === 'location') {
        document.getElementById('onbGetLocation').addEventListener('click', () => {
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                onboardingData.location = { latitude: pos.coords.latitude, longitude: pos.coords.longitude };
                document.getElementById('onbLocationResult').textContent = `📍 ${pos.coords.latitude}, ${pos.coords.longitude}`;
              },
              () => { showToast('Location access denied', 'error'); }
            );
          } else {
            showToast('Geolocation not supported', 'error');
          }
        });
      }
      if (stepId === 'theme') {
        document.querySelectorAll('#onbThemeOptions .btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const theme = btn.dataset.theme;
            // set default colors based on theme
            const colors = {
              dark: { primary: '#6c8cff', secondary: '#1a1f27' },
              minimal: { primary: '#2d3436', secondary: '#dfe6e9' },
              classic: { primary: '#8e44ad', secondary: '#2c3e50' },
              premium: { primary: '#1a1a1a', secondary: '#f1c40f' }
            };
            const c = colors[theme] || colors.dark;
            document.getElementById('onbPrimary').value = c.primary;
            document.getElementById('onbSecondary').value = c.secondary;
          });
        });
      }
    }

    function renderOnbServices() {
      const container = document.getElementById('onbServicesList');
      if (!container) return;
      if (!onboardingData.services || onboardingData.services.length === 0) {
        container.innerHTML = '<p class="text-muted">No services added yet.</p>';
        return;
      }
      let html = '';
      onboardingData.services.forEach((s, i) => {
        html += `<div class="flex-between"><span>${s.name} - $${s.price} (${s.duration}min)</span><button class="btn btn-danger" data-idx="${i}">Remove</button></div>`;
      });
      container.innerHTML = html;
      container.querySelectorAll('[data-idx]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.idx);
          onboardingData.services.splice(idx, 1);
          renderOnbServices();
        });
      });
    }

    function renderOnbBarbers() {
      const container = document.getElementById('onbBarbersList');
      if (!container) return;
      if (!onboardingData.barbers || onboardingData.barbers.length === 0) {
        container.innerHTML = '<p class="text-muted">No barbers added yet.</p>';
        return;
      }
      let html = '';
      onboardingData.barbers.forEach((b, i) => {
        html += `<div class="flex-between"><span>${b.name} ${b.phone ? '📞'+b.phone : ''}</span><button class="btn btn-danger" data-idx="${i}">Remove</button></div>`;
      });
      container.innerHTML = html;
      container.querySelectorAll('[data-idx]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.idx);
          onboardingData.barbers.splice(idx, 1);
          renderOnbBarbers();
        });
      });
    }

    async function finishOnboarding() {
      // validate required fields
      const name = onboardingData.name;
      if (!name) { showToast('Shop name is required', 'error'); return; }
      // generate slug
      let slug = generateSlug(name);
      // check uniqueness
      const q = query(collection(db, 'shops'), where('slug', '==', slug));
      const snap = await getDocs(q);
      if (!snap.empty) {
        slug = `${slug}-${Date.now().toString().slice(-4)}`;
      }
      const shopData = {
        ownerId: currentUser.uid,
        name: name,
        slug: slug,
        description: onboardingData.description || '',
        logoUrl: onboardingData.logoUrl || '',
        logoPublicId: onboardingData.logoPublicId || '',
        coverUrl: onboardingData.coverUrl || '',
        coverPublicId: onboardingData.coverPublicId || '',
        phone: onboardingData.phone || '',
        whatsapp: onboardingData.whatsapp || '',
        address: onboardingData.address || '',
        location: onboardingData.location || null,
        country: onboardingData.country || '',
        currency: onboardingData.currency || 'USD',
        timezone: onboardingData.timezone || 'Africa/Cairo',
        theme: onboardingData.theme || { primary: '#6c8cff', secondary: '#1a1f27' },
        status: 'draft',
        planId: '',
        subscriptionStatus: 'pending',
        paymentStatus: 'pending',
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      };
      try {
        const shopRef = await addDoc(collection(db, 'shops'), shopData);
        // Update user with shopId
        await updateDoc(doc(db, 'users', currentUser.uid), { shopId: shopRef.id });
        // Add services
        if (onboardingData.services && onboardingData.services.length > 0) {
          const batch = writeBatch(db);
          onboardingData.services.forEach(s => {
            const ref = doc(collection(db, 'shops', shopRef.id, 'services'));
            batch.set(ref, {
              name: s.name,
              price: s.price,
              duration: s.duration,
              description: '',
              active: true,
              createdAt: serverTimestamp(),
              updatedAt: serverTimestamp()
            });
          });
          await batch.commit();
        }
        // Add barbers
        if (onboardingData.barbers && onboardingData.barbers.length > 0) {
          const batch = writeBatch(db);
          onboardingData.barbers.forEach(b => {
            const ref = doc(collection(db, 'shops', shopRef.id, 'barbers'));
            batch.set(ref, {
              name: b.name,
              phone: b.phone || '',
              bio: b.bio || '',
              active: true,
              createdAt: serverTimestamp(),
              updatedAt: serverTimestamp()
            });
          });
          await batch.commit();
        }
        // Add working hours
        const days = ['Saturday', 'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
        const batch = writeBatch(db);
        days.forEach(d => {
          const ref = doc(collection(db, 'shops', shopRef.id, 'workingHours'), d);
          const enabled = document.getElementById(`hour_${d}_enabled`)?.checked ?? true;
          const open = document.getElementById(`hour_${d}_open`)?.value || '09:00';
          const close = document.getElementById(`hour_${d}_close`)?.value || '21:00';
          batch.set(ref, {
            enabled,
            openTime: open,
            closeTime: close,
            breaks: []
          });
        });
        await batch.commit();
        // Add gallery
        if (onboardingData.gallery && onboardingData.gallery.length > 0) {
          const batch = writeBatch(db);
          onboardingData.gallery.forEach(g => {
            const ref = doc(collection(db, 'shops', shopRef.id, 'gallery'));
            batch.set(ref, {
              imageUrl: g.url,
              publicId: g.publicId,
              caption: '',
              active: true,
              createdAt: serverTimestamp(),
              updatedAt: serverTimestamp()
            });
          });
          await batch.commit();
        }
        // Activity log
        await addDoc(collection(db, 'activityLogs'), {
          actorId: currentUser.uid,
          actorRole: 'shop_owner',
          action: 'shop_created',
          targetType: 'shop',
          targetId: shopRef.id,
          shopId: shopRef.id,
          description: `Shop "${name}" created`,
          timestamp: serverTimestamp()
        });
        // Create subscription request (free trial)
        await addDoc(collection(db, 'subscriptionRequests'), {
          userId: currentUser.uid,
          shopId: shopRef.id,
          planId: 'free_trial',
          status: 'pending',
          message: 'Free trial request',
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });
        showToast('Shop created! Waiting for admin approval.', 'success');
        // reload state
        currentShopId = shopRef.id;
        const shopSnap = await getDoc(doc(db, 'shops', shopRef.id));
        currentShop = { id: shopSnap.id, ...shopSnap.data() };
        switchPage('page-dashboard');
        renderDashboard();
      } catch (e) {
        console.error(e);
        showToast('Error creating shop: '+e.message, 'error');
      }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // DASHBOARD
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    let activeSection = 'overview';
    let chartInstance = null;

    function renderDashboard() {
      if (!currentShop) return;
      $('#dashboardShopName').textContent = currentShop.name || 'My Shop';
      const status = currentShop.status || 'draft';
      const badge = $('#shopStatusBadge');
      badge.textContent = status;
      badge.className = `badge badge-${status}`;
      // Navigation
      document.querySelectorAll('#dashboardNav a').forEach(a => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          document.querySelectorAll('#dashboardNav a').forEach(el => el.classList.remove('active'));
          a.classList.add('active');
          activeSection = a.dataset.section;
          renderSection(activeSection);
        });
      });
      renderSection(activeSection);
      // realtime listeners
      setupRealtime();
    }

    function renderSection(section) {
      const container = $('#dashboardContent');
      container.innerHTML = `<div class="section-loading">Loading...</div>`;
      switch (section) {
        case 'overview':
          renderOverview(container);
          break;
        case 'services':
          renderServices(container);
          break;
        case 'barbers':
          renderBarbers(container);
          break;
        case 'bookings':
          renderBookings(container);
          break;
        case 'customers':
          renderCustomers(container);
          break;
        case 'reviews':
          renderReviews(container);
          break;
        case 'gallery':
          renderGallery(container);
          break;
        case 'hours':
          renderHours(container);
          break;
        case 'holidays':
          renderHolidays(container);
          break;
        case 'subscription':
          renderSubscription(container);
          break;
        case 'qr':
          renderQR(container);
          break;
        case 'settings':
          renderSettings(container);
          break;
        default:
          container.innerHTML = '<p>Section not implemented</p>';
      }
    }

    // ─── OVERVIEW ───
    async function renderOverview(container) {
      const shopId = currentShopId;
      // stats
      const servicesSnap = await getDocs(collection(db, 'shops', shopId, 'services'));
      const barbersSnap = await getDocs(collection(db, 'shops', shopId, 'barbers'));
      const bookingsSnap = await getDocs(collection(db, 'shops', shopId, 'bookings'));
      const customersSnap = await getDocs(collection(db, 'shops', shopId, 'customers'));
      const reviewsSnap = await getDocs(collection(db, 'shops', shopId, 'reviews'));
      const today = new Date();
      today.setHours(0,0,0,0);
      const todayBookings = bookingsSnap.docs.filter(d => {
        const date = d.data().date?.toDate?.() || new Date(d.data().date);
        return date >= today;
      });
      const pending = todayBookings.filter(d => d.data().status === 'pending').length;
      const confirmed = todayBookings.filter(d => d.data().status === 'confirmed').length;
      const completed = todayBookings.filter(d => d.data().status === 'completed').length;
      const cancelled = todayBookings.filter(d => d.data().status === 'cancelled').length;
      let avgRating = 0;
      const reviews = reviewsSnap.docs.map(d => d.data());
      if (reviews.length) {
        const sum = reviews.reduce((acc, r) => acc + (r.rating||0), 0);
        avgRating = sum / reviews.length;
      }
      container.innerHTML = `

    async function loadHours() {
      const container = document.getElementById('hoursForm');
      if (!container) return;
      const days = ['Saturday', 'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
      let html = '';
      for (const d of days) {
        const docRef = doc(db, 'shops', currentShopId, 'workingHours', d);
        const snap = await getDoc(docRef);
        const data = snap.exists() ? snap.data() : { enabled: true, openTime: '09:00', closeTime: '21:00' };
        html += `
          <div class="flex" style="margin-bottom:8px;">
            <span style="width:100px;">${d}</span>
            <input type="checkbox" id="hour_${d}_enabled" ${data.enabled?'checked':''} />
            <label>Open</label>
            <input type="time" id="hour_${d}_open" value="${data.openTime||'09:00'}" />
            <input type="time" id="hour_${d}_close" value="${data.closeTime||'21:00'}" />
          </div>
        `;
      }
      container.innerHTML = html;
      document.getElementById('saveHours').addEventListener('click', async () => {
        const batch = writeBatch(db);
        for (const d of days) {
          const ref = doc(db, 'shops', currentShopId, 'workingHours', d);
          const enabled = document.getElementById(`hour_${d}_enabled`).checked;
          const open = document.getElementById(`hour_${d}_open`).value;
          const close = document.getElementById(`hour_${d}_close`).value;
          batch.set(ref, { enabled, openTime: open, closeTime: close, breaks: [] }, { merge: true });
        }
        await batch.commit();
        showToast('Working hours saved!', 'success');
      });
    }

        html += `<tr><td>${formatDate(h.date)}</td><td>${h.reason||''}</td><td><button class="btn btn-danger" onclick="deleteHoliday('${h.id}')">Delete</button></td></tr>`;
      });
      html += '</tbody></table></div>';
      container.innerHTML = html;
    }

    window.deleteHoliday = async function(id) {
      if (!confirm('Delete this holiday?')) return;
      try {
        await deleteDoc(doc(db, 'shops', currentShopId, 'holidays', id));
        showToast('Holiday deleted', 'info');
        loadHolidays();
      } catch (e) { showToast(e.message, 'error'); }
    };

    // ─── SUBSCRIPTION ───
    function renderSubscription(container) {
      container.innerHTML = `
        <div class="card">
          <div class="card-header"><h3>Subscription</h3></div>
          <div id="subInfo"></div>
        </div>
      `;
      loadSubscription();
    }

    async function loadSubscription() {
      const container = document.getElementById('subInfo');
      if (!container) return;
      // get subscription for this shop
      const q = query(collection(db, 'subscriptions'), where('shopId', '==', currentShopId), orderBy('createdAt', 'desc'), limit(1));
      const snap = await getDocs(q);
      let sub = null;
      if (!snap.empty) {
        sub = { id: snap.docs[0].id, ...snap.docs[0].data() };
      }
      if (!sub) {
        container.innerHTML = `<p class="text-muted">No subscription found. Please request a plan.</p>
          <button class="btn btn-primary" id="requestSubBtn">Request Subscription</button>`;
        document.getElementById('requestSubBtn').addEventListener('click', () => {
          // simple request
          const html = `
            <div class="modal-title">Request Subscription</div>
            <div class="form-group"><label>Plan</label><select id="reqPlan"><option value="free_trial">Free Trial</option><option value="basic">Basic</option><option value="pro">Pro</option></select></div>
            <div class="form-group"><label>Message</label><textarea id="reqMsg"></textarea></div>
            <div class="modal-actions">
              <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
              <button class="btn btn-primary" id="submitReq">Submit</button>
            </div>
          `;
          openModal(html);
          document.getElementById('submitReq').addEventListener('click', async () => {
            const plan = document.getElementById('reqPlan').value;
            const msg = document.getElementById('reqMsg').value.trim();
            try {
              await addDoc(collection(db, 'subscriptionRequests'), {
                userId: currentUser.uid,
                shopId: currentShopId,
                planId: plan,
                message: msg || 'Request',
                status: 'pending',
                createdAt: serverTimestamp(),
                updatedAt: serverTimestamp()
              });
              closeModal();
              showToast('Request submitted!', 'success');
              loadSubscription();
            } catch (e) { showToast(e.message, 'error'); }
          });
        });
        return;
      }
      container.innerHTML = `
        <div><strong>Plan:</strong> ${sub.planName || sub.planId || 'N/A'}</div>
        <div><strong>Status:</strong> <span class="badge badge-${sub.status||'pending'}">${sub.status||'pending'}</span></div>
        <div><strong>Started:</strong> ${formatDate(sub.startedAt)}</div>
        <div><strong>Expires:</strong> ${formatDate(sub.expiresAt)}</div>
        <div><strong>Payment:</strong> ${sub.paymentStatus||'N/A'}</div>
      `;
    }

    // ─── QR ───
    function renderQR(container) {
      const url = `${window.location.origin}/s/${currentShop.slug}`;
      container.innerHTML = `
        <div class="card">
          <div class="card-header"><h3>QR Code</h3></div>
          <div style="text-align:center;padding:20px;">
            <div id="qrContainer"></div>
            <p class="text-muted">Scan to visit: ${url}</p>
            <button class="btn btn-primary" id="copyLinkBtn">Copy Link</button>
            <button class="btn btn-primary" id="downloadQRBtn">Download QR</button>
          </div>
        </div>
      `;
      // Generate QR using a simple library (or inline)
      // We'll use a QR code generation library from CDN (or just use a canvas-based one)
      // For simplicity, we'll use a placeholder QR code using a free API
      const img = document.createElement('img');
      img.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
      img.alt = 'QR Code';
      document.getElementById('qrContainer').appendChild(img);

      document.getElementById('copyLinkBtn').addEventListener('click', () => {
        navigator.clipboard.writeText(url).then(() => showToast('Link copied!', 'success'));
      });
      document.getElementById('downloadQRBtn').addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'qr.png';
        link.href = img.src;
        link.click();
      });
    }

    // ─── SETTINGS ───
    function renderSettings(container) {
      container.innerHTML = `
        <div class="card">
          <div class="card-header"><h3>Shop Settings</h3></div>
          <div class="form-group"><label>Shop Name</label><input type="text" id="setName" value="${currentShop.name||''}" /></div>
          <div class="form-group"><label>Description</label><textarea id="setDesc">${currentShop.description||''}</textarea></div>
          <div class="form-group"><label>Phone</label><input type="tel" id="setPhone" value="${currentShop.phone||''}" /></div>
          <div class="form-group"><label>WhatsApp</label><input type="tel" id="setWhatsapp" value="${currentShop.whatsapp||''}" /></div>
          <div class="form-group"><label>Address</label><textarea id="setAddress">${currentShop.address||''}</textarea></div>
          <button class="btn btn-primary" id="saveSettingsBtn">Save Settings</button>
        </div>
      `;
      document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
        const name = document.getElementById('setName').value.trim();
        const desc = document.getElementById('setDesc').value.trim();
        const phone = document.getElementById('setPhone').value.trim();
        const whatsapp = document.getElementById('setWhatsapp').value.trim();
        const address = document.getElementById('setAddress').value.trim();
        if (!name) { showToast('Name is required', 'error'); return; }
        try {
          await updateDoc(doc(db, 'shops', currentShopId), {
            name,
            description: desc,
            phone,
            whatsapp,
            address,
            updatedAt: serverTimestamp()
          });
          showToast('Settings saved!', 'success');
          // update local shop
          currentShop.name = name;
          currentShop.description = desc;
          currentShop.phone = phone;
          currentShop.whatsapp = whatsapp;
          currentShop.address = address;
          $('#dashboardShopName').textContent = name;
        } catch (e) { showToast(e.message, 'error'); }
      });
    }

    // ─── REALTIME LISTENERS ───
    function setupRealtime() {
      // Listen for bookings changes (for overview)
      const unsub = onSnapshot(collection(db, 'shops', currentShopId, 'bookings'), () => {
        if (activeSection === 'overview') renderOverview(document.getElementById('dashboardContent'));
        if (activeSection === 'bookings') loadBookings();
      });
      unsubscribers.push(unsub);
    }

    // ─── MODAL HELPERS ───
    function openModal(html) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;';
      const box = document.createElement('div');
      box.className = 'modal-box';
      box.style.cssText = 'background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;';
      box.innerHTML = html;
      overlay.appendChild(box);
      document.body.appendChild(overlay);
      // close on overlay click
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeModal();
      });
      window.closeModal = () => {
        if (overlay.parentNode) overlay.remove();
      };
    }
    window.openModal = openModal;
    window.closeModal = window.closeModal || (() => {});

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // PUBLIC SHOP ROUTE
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // Detect if URL contains /s/slug
    async function loadPublicShop() {
      const path = window.location.pathname;
      const match = path.match(/^\/s\/([^\/]+)/);
      if (match) {
        const slug = match[1];
        switchPage('page-public');
        await renderPublicShop(slug);
      }
    }

    async function renderPublicShop(slug) {
      const container = document.getElementById('publicContent');
      container.innerHTML = '<div style="text-align:center;padding:40px;"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
      try {
        const q = query(collection(db, 'shops'), where('slug', '==', slug), limit(1));
        const snap = await getDocs(q);
        if (snap.empty) {
          container.innerHTML = '<div style="text-align:center;padding:40px;"><h2>Shop not found</h2></div>';
          return;
        }
        const shop = { id: snap.docs[0].id, ...snap.docs[0].data() };
        // Check status
        if (shop.status !== 'active' || shop.subscriptionStatus !== 'active') {
          container.innerHTML = `<div style="text-align:center;padding:40px;"><h2>This shop is currently unavailable</h2><p class="text-muted">Please check back later.</p></div>`;
          return;
        }
        // Load services, barbers, gallery, reviews, hours
        const servicesSnap = await getDocs(collection(db, 'shops', shop.id, 'services'));
        const services = servicesSnap.docs.map(d => d.data());
        const barbersSnap = await getDocs(collection(db, 'shops', shop.id, 'barbers'));
        const barbers = barbersSnap.docs.map(d => d.data());
        const gallerySnap = await getDocs(collection(db, 'shops', shop.id, 'gallery'));
        const gallery = gallerySnap.docs.map(d => d.data());
        const reviewsSnap = await getDocs(collection(db, 'shops', shop.id, 'reviews'));
        const reviews = reviewsSnap.docs.map(d => d.data()).filter(r => r.status === 'approved');
        const hours = {};
        const days = ['Saturday', 'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
        for (const d of days) {
          const docRef = doc(db, 'shops', shop.id, 'workingHours', d);
          const snap = await getDoc(docRef);
          if (snap.exists()) hours[d] = snap.data();
        }
        // Render
        let html = `
          <div class="shop-hero">
            ${shop.logoUrl ? `<img src="${shop.logoUrl}" alt="Logo" />` : ''}
            <h1>${shop.name}</h1>
            <p>${shop.description||''}</p>
            ${shop.phone ? `<p><i class="fas fa-phone"></i> ${shop.phone}</p>` : ''}
            ${shop.whatsapp ? `<p><i class="fab fa-whatsapp"></i> <a href="https://wa.me/${shop.whatsapp.replace(/\D/g,'')}" target="_blank">Contact on WhatsApp</a></p>` : ''}
          </div>
          <div style="max-width:700px;margin:0 auto;">
            <h3>Our Services</h3>
            ${services.map(s => `<div class="service-card"><div class="flex-between"><span><strong>${s.name}</strong></span><span class="price">${shop.currency||'$'}${s.price}</span></div><div class="text-muted">${s.duration||0} min</div></div>`).join('')}
            <h3>Barbers</h3>
            ${barbers.filter(b=>b.active).map(b => `<div class="barber-card"><strong>${b.name}</strong><p>${b.bio||''}</p></div>`).join('')}
            <h3>Reviews</h3>
            ${reviews.map(r => `<div><strong>${r.customerName||'Anonymous'}</strong> ${'★'.repeat(r.rating||0)}<p>${r.review||''}</p></div>`).join('')}
            <h3>Working Hours</h3>
            ${days.map(d => `<div class="flex-between"><span>${d}</span><span>${hours[d]?.enabled ? (hours[d].openTime + ' - ' + hours[d].closeTime) : 'Closed'}</span></div>`).join('')}
            <h3>Book an Appointment</h3>
            <div class="booking-form">
              <div class="form-group"><label>Service</label><select id="bookService">${services.map((s,i) => `<option value="${i}">${s.name} - ${shop.currency}${s.price}</option>`).join('')}</select></div>
              <div class="form-group"><label>Barber</label><select id="bookBarber"><option value="">Any</option>${barbers.filter(b=>b.active).map(b => `<option value="${b.id}">${b.name}</option>`).join('')}</select></div>
              <div class="form-group"><label>Date</label><input type="date" id="bookDate" /></div>
              <div class="form-group"><label>Time</label><input type="time" id="bookTime" /></div>
              <div class="form-group"><label>Your Name</label><input type="text" id="bookName" /></div>
              <div class="form-group"><label>Phone</label><input type="tel" id="bookPhone" /></div>
              <div class="form-group"><label>Email (optional)</label><input type="email" id="bookEmail" /></div>
              <button class="btn btn-primary w-full" id="bookNowBtn">Book Now</button>
            </div>
          </div>
        `;
        container.innerHTML = html;

        // Booking logic
        document.getElementById('bookNowBtn').addEventListener('click', async () => {
          const serviceIdx = parseInt(document.getElementById('bookService').value);
          const service = services[serviceIdx];
          const barberId = document.getElementById('bookBarber').value;
          const date = document.getElementById('bookDate').value;
          const time = document.getElementById('bookTime').value;
          const name = document.getElementById('bookName').value.trim();
          const phone = document.getElementById('bookPhone').value.trim();
          const email = document.getElementById('bookEmail').value.trim();
          if (!date || !time || !name || !phone) {
            showToast('Please fill all required fields', 'error');
            return;
          }
          // Combine date and time
          const bookingDateTime = new Date(`${date}T${time}`);
          if (isNaN(bookingDateTime.getTime())) {
            showToast('Invalid date/time', 'error');
            return;
          }
          // Check availability via Firestore transaction
          try {
            await runTransaction(db, async (transaction) => {
              // Check for existing bookings at that time
              const start = Timestamp.fromDate(bookingDateTime);
              const end = Timestamp.fromDate(new Date(bookingDateTime.getTime() + (service.duration||30)*60000));
              // Query for overlapping bookings
              const q = query(
                collection(db, 'shops', shop.id, 'bookings'),
                where('date', '>=', start),
                where('date', '<', end),
                where('barberId', '==', barberId || '')
              );
              const snap = await getDocs(q);
              if (!snap.empty) {
                throw new Error('Time slot already booked. Please choose another.');
              }
              // Also check holidays
              const holidayQ = query(collection(db, 'shops', shop.id, 'holidays'), where('date', '==', start));
              const holidaySnap = await getDocs(holidayQ);
              if (!holidaySnap.empty) {
                throw new Error('This date is a holiday.');
              }
              // Create booking
              const bookingRef = doc(collection(db, 'shops', shop.id, 'bookings'));
              transaction.set(bookingRef, {
                shopId: shop.id,
                customerName: name,
                customerPhone: phone,
                customerEmail: email || '',
                serviceId: service.id,
                serviceName: service.name,
                barberId: barberId || '',
                barberName: barbers.find(b => b.id === barberId)?.name || '',
                date: start,
                startTime: time,
                endTime: new Date(bookingDateTime.getTime() + (service.duration||30)*60000).toTimeString().slice(0,5),
                price: service.price,
                currency: shop.currency || 'USD',
                status: 'pending',
                notes: '',
                createdAt: serverTimestamp(),
                updatedAt: serverTimestamp()
              });
              // Update or create customer
              const customerRef = doc(collection(db, 'shops', shop.id, 'customers'));
              // find existing customer by phone (simplified)
              const custQ = query(collection(db, 'shops', shop.id, 'customers'), where('phone', '==', phone));
              const custSnap = await getDocs(custQ);
              if (custSnap.empty) {
                transaction.set(customerRef, {
                  name: name,
                  phone: phone,
                  email: email || '',
                  bookingCount: 1,
                  lastBookingAt: start,
                  createdAt: serverTimestamp(),
                  updatedAt: serverTimestamp()
                });
              } else {
                const custDoc = custSnap.docs[0];
                transaction.update(custDoc.ref, {
                  bookingCount: increment(1),
                  lastBookingAt: start,
                  updatedAt: serverTimestamp()
                });
              }
            });
            showToast('Booking confirmed!', 'success');
            // Optionally reload page to update
          } catch (e) {
            showToast(e.message || 'Booking failed', 'error');
          }
        });
      } catch (e) {
        container.innerHTML = `<div style="text-align:center;padding:40px;"><h2>Error loading shop</h2><p class="text-muted">${e.message}</p></div>`;
      }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // ROUTE HANDLER
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function handleRoute() {
      const path = window.location.pathname;
      if (path.startsWith('/s/')) {
        loadPublicShop();
        return;
      }
      // default: dashboard or login based on auth
      if (currentUser) {
        if (currentRole === 'shop_owner') {
          if (!currentShopId) {
            switchPage('page-onboarding');
            renderOnboarding();
          } else {
            switchPage('page-dashboard');
            renderDashboard();
          }
        } else {
          switchPage('page-login');
        }
      } else {
        switchPage('page-login');
      }
    }

    // ─── INIT ───
    window.addEventListener('popstate', handleRoute);
    // Also handle initial load
    // Wait for auth to settle
    setTimeout(() => {
      handleRoute();
    }, 500);

    // expose some functions globally
    window.currentShopId = () => currentShopId;
    window.currentShop = () => currentShop;
    window.db = db;
    window.auth = auth;

    console.log('🚀 BarberSaaS loaded.');
  </script>
</body>
</html>
