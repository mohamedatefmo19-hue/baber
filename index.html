<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
  <title>BarberSaaS - منصة حجوزات الحلاقة</title>

  <!-- Firebase Modular SDK -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
      }
    }
  </script>

  <!-- Chart.js (اختياري) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    /* ── نفس الـ CSS السابق ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #0b0d10;
      color: #f0f2f5;
      min-height: 100vh;
    }
    :root {
      --bg: #0b0d10;
      --bg2: #12151b;
      --card: #1a1f27;
      --border: #2a3440;
      --text: #f0f2f5;
      --text2: #a0b0c4;
      --muted: #6a7b8f;
      --accent: #6c8cff;
      --accent-dim: rgba(108, 140, 255, 0.15);
      --green: #2ecc71;
      --red: #e74c5e;
      --orange: #f39c12;
    }
    .page {
      display: none;
      width: 100%;
      min-height: 100vh;
      padding: 20px;
    }
    .page.active {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      width: 100%;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }
    .card-header h3 {
      font-size: 18px;
      font-weight: 600;
    }
    .btn {
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 500;
      font-size: 14px;
      transition: 0.2s;
      border: 1px solid var(--border);
      color: var(--text2);
      background: transparent;
      cursor: pointer;
    }
    .btn:hover {
      background: var(--border);
      color: var(--text);
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-primary:hover {
      background: #5a7ae8;
    }
    .btn-green {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }
    .btn-danger {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }
    .btn-block {
      width: 100%;
      padding: 12px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      margin-bottom: 4px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 600px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }
    .flex {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .text-muted {
      color: var(--muted);
    }
    .text-center {
      text-align: center;
    }
    .mt-20 {
      margin-top: 20px;
    }
    .mb-20 {
      margin-bottom: 20px;
    }
    .w-full {
      width: 100%;
    }
    .badge {
      display: inline-block;
      padding: 2px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-active {
      background: var(--green);
      color: #fff;
    }
    .badge-pending {
      background: var(--orange);
      color: #fff;
    }
    .badge-suspended {
      background: var(--red);
      color: #fff;
    }
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    table th {
      text-align: right;
      padding: 10px 12px;
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }
    table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text2);
    }
    .dashboard-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .dashboard-nav a {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      color: var(--text2);
      transition: 0.2s;
      cursor: pointer;
      text-decoration: none;
    }
    .dashboard-nav a:hover,
    .dashboard-nav a.active {
      background: var(--accent-dim);
      color: var(--accent);
    }
    #toast-container {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 400px;
      width: 100%;
      pointer-events: none;
    }
    .toast {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
      animation: slideUp 0.3s ease;
    }
    .toast.success {
      border-right: 4px solid var(--green);
    }
    .toast.error {
      border-right: 4px solid var(--red);
    }
    .toast.info {
      border-right: 4px solid var(--accent);
    }
    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    .shop-hero {
      text-align: center;
      padding: 40px 20px;
    }
    .shop-hero img {
      max-width: 160px;
      border-radius: 50%;
      border: 2px solid var(--border);
    }
    .shop-hero h1 {
      font-size: 32px;
      margin-top: 16px;
    }
    .service-card,
    .barber-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .service-card .price {
      color: var(--accent);
      font-weight: 600;
    }
    .booking-form {
      max-width: 500px;
      margin: 0 auto;
    }
    #onboardingContent .step-indicator {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      font-size: 12px;
      color: var(--muted);
    }
    #onboardingContent .step-indicator .active-step {
      color: var(--accent);
      font-weight: 600;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }
    .modal-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <!-- ─── TOAST CONTAINER ─── -->
  <div id="toast-container"></div>

  <!-- ─── PAGE: LOGIN ─── -->
  <div id="page-login" class="page active">
    <div class="container" style="max-width:400px; margin-top:60px;">
      <div class="card">
        <h2 style="text-align:center;">✂ BarberSaaS</h2>
        <p class="text-center text-muted">تسجيل الدخول لأصحاب المحلات</p>
        <div id="loginError" style="color:var(--red); margin-bottom:12px; display:none;"></div>
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="loginEmail" placeholder="owner@example.com" />
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="loginPassword" placeholder="••••••••" />
        </div>
        <button class="btn btn-primary btn-block" id="loginBtn">دخول</button>
        <p class="text-center text-muted mt-20" style="font-size:14px;">

  <!-- ─── PAGE: SIGNUP ─── -->
  <div id="page-signup" class="page">
    <div class="container" style="max-width:400px; margin-top:60px;">
      <div class="card">
        <h2 style="text-align:center;">إنشاء حساب</h2>
        <p class="text-center text-muted">ابدأ متجرك الآن</p>

  <!-- ─── PAGE: ONBOARDING ─── -->
  <div id="page-onboarding" class="page">
    <div class="container" style="max-width:700px; padding-top:20px;">
      <div class="card">
        <div class="flex-between">
          <h2>🏪 إنشاء المتجر</h2>
          <span id="onboardingStep" class="text-muted">الخطوة 1 / 10</span>
        </div>
        <div id="onboardingContent">
          <!-- يتم عرض المحتوى ديناميكياً -->

  <!-- ─── PAGE: OWNER DASHBOARD ─── -->
  <div id="page-dashboard" class="page">
    <div class="container">
      <div class="flex-between" style="margin-bottom:16px;">
        <h2 id="dashboardShopName">متجري</h2>
        <div class="flex">
          <span id="shopStatusBadge" class="badge badge-pending">قيد الانتظار</span>
          <button class="btn btn-primary" id="logoutBtn" style="margin-right:12px;">تسجيل خروج</button>
        </div>
      </div>
      <nav class="dashboard-nav" id="dashboardNav">
        <a data-section="overview" class="active">نظرة عامة</a>
        <a data-section="services">الخدمات</a>
        <a data-section="barbers">الحلاقون</a>

        <a data-section="gallery">معرض الصور</a>
        <a data-section="hours">ساعات العمل</a>

        <a data-section="settings">الإعدادات</a>
      </nav>
      <div id="dashboardContent">
        <!-- يتم عرض كل قسم ديناميكياً -->

  </div>

  <!-- ─── PAGE: PUBLIC SHOP ─── -->
  <div id="page-public" class="page">
    <div id="publicContent" class="container">
      <!-- يتم عرض المتجر العام ديناميكياً -->
    </div>
  </div>

  <!-- ─── SCRIPTS ─── -->
  <script type="module">
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // IMPORTS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    import { initializeApp } from 'firebase/app';
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut,
      updateProfile
    } from 'firebase/auth';
    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      getDocs,
      addDoc,
      setDoc,
      updateDoc,
      deleteDoc,
      query,
      where,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp,
      runTransaction,
      writeBatch,
      Timestamp,
      increment,
      getCountFromServer
    } from 'firebase/firestore';

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // CONFIG
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const firebaseConfig = {
      apiKey: "AIzaSyA0IWiY-tI30LX2PS9G2T2gEiBAEd4GqzU",
      authDomain: "salons-feee4.firebaseapp.com",
      projectId: "salons-feee4",
      storageBucket: "salons-feee4.firebasestorage.app",
      messagingSenderId: "601094041409",
      appId: "1:601094041409:web:d03a02de993fbb203cbbc0",
      measurementId: "G-GP53GSCW0C"
    };
    const CLOUDINARY = { cloudName: 'deaevfmvm', uploadPreset: 'salons1' };

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // INIT
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // DOM REFS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);
    const toastContainer = $('#toast-container');

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // HELPERS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function showToast(msg, type = 'info', duration = 3500) {
      const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-circle-info' };
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.innerHTML = `<span><i class="fas ${icons[type]||icons.info}"></i></span><span>${msg}</span><span onclick="this.parentElement.remove()" style="margin-right:auto;cursor:pointer;">&times;</span>`;
      toastContainer.appendChild(el);
      setTimeout(() => { if (el.parentNode) el.remove(); }, duration);
    }
    window.showToast = showToast;

    function switchPage(pageId) {
      $$('.page').forEach(p => p.classList.remove('active'));
      const target = document.getElementById(pageId);
      if (target) target.classList.add('active');
    }

    function formatDate(d) {
      if (!d) return 'N/A';
      if (d.toDate) d = d.toDate();
      return d.toLocaleDateString('ar-EG');
    }

    function formatTime(d) {
      if (!d) return 'N/A';
      if (d.toDate) d = d.toDate();
      return d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
    }

    async function uploadToCloudinary(file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY.uploadPreset);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/image/upload`, {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || 'فشل الرفع');
      return { url: data.secure_url, publicId: data.public_id };
    }

    function generateSlug(name) {
      return name.trim().toLowerCase()
        .replace(/[^\u0600-\u06FFa-z0-9]+/g, '-')
        .replace(/^-|-$/g, '')
        .substring(0, 60);
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // STATE
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    let currentUser = null;
    let currentShop = null;
    let currentShopId = null;
    let currentRole = null;
    let unsubscribers = [];

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // AUTH
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        try {
          const userDoc = await getDoc(doc(db, 'users', user.uid));
          if (userDoc.exists()) {
            const data = userDoc.data();
            currentRole = data.role || 'customer';
            currentShopId = data.shopId || null;
            if (currentShopId) {
              const shopSnap = await getDoc(doc(db, 'shops', currentShopId));
              if (shopSnap.exists()) {
                currentShop = { id: shopSnap.id, ...shopSnap.data() };
              }
            }
            if (currentRole === 'shop_owner') {
              if (!currentShopId) {
                switchPage('page-onboarding');
                renderOnboarding();
              } else {
                switchPage('page-dashboard');
                renderDashboard();
              }
            } else {
              showToast('أنت لست مالك متجر.', 'error');
              switchPage('page-login');
            }
          } else {
            showToast('بيانات المستخدم غير مكتملة، يرجى إعادة التسجيل.', 'error');
            await signOut(auth);
            switchPage('page-login');
          }
        } catch (e) {
          console.error(e);
          showToast('خطأ في تحميل بيانات المستخدم', 'error');
        }
      } else {
        currentUser = null;
        currentRole = null;
        currentShop = null;
        currentShopId = null;
        unsubscribers.forEach(fn => fn());
        unsubscribers = [];
        switchPage('page-login');
      }
    });

    // ─── Login ───
    $('#loginBtn').addEventListener('click', async () => {
      const email = $('#loginEmail').value.trim();
      const password = $('#loginPassword').value;
      const errEl = $('#loginError');
      errEl.style.display = 'none';
      if (!email || !password) { errEl.textContent = 'يرجى ملء جميع الحقول.';
        errEl.style.display = 'block'; return; }
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (e) {
        errEl.textContent = e.message;
        errEl.style.display = 'block';
      }
    });

    // ─── Signup ───
    $('#signupBtn').addEventListener('click', async () => {
      const name = $('#signupName').value.trim();
      const email = $('#signupEmail').value.trim();
      const password = $('#signupPassword').value;
      const phone = $('#signupPhone').value.trim();
      const errEl = $('#signupError');
      errEl.style.display = 'none';
      if (!name || !email || !password) { errEl.textContent = 'جميع الحقول مطلوبة.';
        errEl.style.display = 'block'; return; }
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: name });
        await setDoc(doc(db, 'users', cred.user.uid), {
          name,
          email,
          phone: phone || '',
          role: 'shop_owner',
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });
        showToast('تم إنشاء الحساب! جارٍ التوجيه إلى إعداد المتجر.', 'success');
      } catch (e) {
        errEl.textContent = e.message;
        errEl.style.display = 'block';
      }
    });

    // ─── Logout ───
    $('#logoutBtn').addEventListener('click', async () => {
      await signOut(auth);
      showToast('تم تسجيل الخروج', 'info');
    });

    // ─── Toggle pages ───
    $('#goToSignup').addEventListener('click', (e) => { e.preventDefault();
      switchPage('page-signup'); });
    $('#goToLogin').addEventListener('click', (e) => { e.preventDefault();
      switchPage('page-login'); });

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // ONBOARDING (المعدل لحفظ البيانات)
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const onboardingSteps = [
      { id: 'info', label: 'معلومات المتجر' },
      { id: 'logo', label: 'شعار المتجر' },
      { id: 'cover', label: 'صورة الغلاف' },
      { id: 'services', label: 'الخدمات' },
      { id: 'hours', label: 'ساعات العمل' },
      { id: 'barbers', label: 'الحلاقون' },
      { id: 'gallery', label: 'معرض الصور' },
      { id: 'whatsapp', label: 'واتساب' },
      { id: 'location', label: 'الموقع' },
      { id: 'theme', label: 'المظهر' },
    ];
    let onboardingData = {
      services: [],
      barbers: [],
      gallery: [],
      theme: { primary: '#6c8cff', secondary: '#1a1f27' }
    };
    let onboardingIndex = 0;

    function renderOnboarding() {
      const container = $('#onboardingContent');
      const step = onboardingSteps[onboardingIndex];
      if (!step) {
        // انتهت الخطوات (لن يحدث)
        return;
      }
      $('#onboardingStep').textContent = `الخطوة ${onboardingIndex+1} / ${onboardingSteps.length}`;
      let html = `<div class="step-indicator">${onboardingSteps.map((s, i) => `<span class="${i===onboardingIndex?'active-step':''}">${i+1}</span>`).join(' · ')}</div>`;
      html += `<h3>${step.label}</h3>`;
      switch (step.id) {
        case 'info':
          html += `
            <div class="form-group"><label>اسم المتجر *</label><input type="text" id="onbName" placeholder="محمد للحلاقة" value="${onboardingData.name||''}" /></div>
            <div class="form-group"><label>وصف المتجر</label><textarea id="onbDesc" placeholder="نقدم خدمات حلاقة احترافية...">${onboardingData.description||''}</textarea></div>
            <div class="form-group"><label>رقم الهاتف</label><input type="tel" id="onbPhone" placeholder="+201234567890" value="${onboardingData.phone||''}" /></div>
            <div class="form-group"><label>الدولة</label><input type="text" id="onbCountry" placeholder="مصر" value="${onboardingData.country||''}" /></div>
            <div class="form-group"><label>العملة</label><select id="onbCurrency"><option value="USD" ${onboardingData.currency==='USD'?'selected':''}>دولار أمريكي</option><option value="EGP" ${onboardingData.currency==='EGP'?'selected':''}>جنيه مصري</option><option value="EUR" ${onboardingData.currency==='EUR'?'selected':''}>يورو</option></select></div>
            <div class="form-group"><label>المنطقة الزمنية</label><input type="text" id="onbTz" placeholder="Africa/Cairo" value="${onboardingData.timezone||'Africa/Cairo'}" /></div>
          `;
          break;
        case 'logo':
          html += `
            <p class="text-muted">ارفع شعار المتجر (مربع، الحد الأقصى 2 ميجابايت)</p>
            <input type="file" id="onbLogo" accept="image/*" />
            <div id="onbLogoPreview" style="margin-top:10px;">${onboardingData.logoUrl ? `<img src="${onboardingData.logoUrl}" style="max-width:120px;border-radius:8px;" />` : ''}</div>
          `;
          break;
        case 'cover':
          html += `
            <p class="text-muted">ارفع صورة غلاف (عرض 1200×400، الحد الأقصى 5 ميجابايت)</p>
            <input type="file" id="onbCover" accept="image/*" />
            <div id="onbCoverPreview" style="margin-top:10px;">${onboardingData.coverUrl ? `<img src="${onboardingData.coverUrl}" style="max-width:200px;border-radius:8px;" />` : ''}</div>
          `;
          break;
        case 'services':
          html += `
            <p class="text-muted">أضف الخدمات التي تقدمها (خدمة واحدة على الأقل)</p>
            <div id="onbServicesList"></div>
            <div class="grid-2">
              <div class="form-group"><label>اسم الخدمة</label><input type="text" id="onbServiceName" placeholder="حلاقة رجالي" /></div>
              <div class="form-group"><label>السعر</label><input type="number" id="onbServicePrice" placeholder="50" step="0.01" /></div>
            </div>
            <div class="form-group"><label>المدة (دقائق)</label><input type="number" id="onbServiceDuration" placeholder="30" /></div>
            <button class="btn btn-primary" id="onbAddService">+ إضافة خدمة</button>
          `;
          break;
        case 'hours':
          html += `
            <p class="text-muted">حدد ساعات العمل لكل يوم</p>
            <div id="onbHoursContainer"></div>
          `;
          break;
        case 'barbers':
          html += `
            <p class="text-muted">أضف الحلاقين (اختياري)</p>
            <div id="onbBarbersList"></div>
            <div class="grid-2">
              <div class="form-group"><label>اسم الحلاق</label><input type="text" id="onbBarberName" placeholder="أحمد" /></div>
              <div class="form-group"><label>رقم الهاتف</label><input type="text" id="onbBarberPhone" placeholder="+201234567890" /></div>
            </div>
            <div class="form-group"><label>السيرة الذاتية</label><textarea id="onbBarberBio" placeholder="خبرة 5 سنوات..."></textarea></div>
            <button class="btn btn-primary" id="onbAddBarber">+ إضافة حلاق</button>
          `;
          break;
        case 'gallery':
          html += `
            <p class="text-muted">ارفع صوراً للمعرض (اختياري)</p>
            <input type="file" id="onbGallery" accept="image/*" multiple />
            <div id="onbGalleryPreview" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;">${(onboardingData.gallery||[]).map(g => `<img src="${g.url}" style="max-width:80px;border-radius:8px;" />`).join('')}</div>
          `;
          break;
        case 'whatsapp':
          html += `
            <div class="form-group"><label>رقم واتساب (مع مفتاح الدولة)</label><input type="tel" id="onbWhatsapp" placeholder="+201234567890" value="${onboardingData.whatsapp||''}" /></div>
            <p class="text-muted">سيتواصل العملاء معك عبر واتساب.</p>
          `;
          break;
        case 'location':
          html += `
            <div class="form-group"><label>العنوان</label><textarea id="onbAddress" placeholder="شارع النيل، القاهرة">${onboardingData.address||''}</textarea></div>
            <button class="btn btn-primary" id="onbGetLocation">الحصول على الموقع الحالي</button>
            <div id="onbLocationResult" class="text-muted" style="margin-top:8px;">${onboardingData.location ? `📍 ${onboardingData.location.latitude}, ${onboardingData.location.longitude}` : ''}</div>
          `;
          break;
        case 'theme':
          html += `
            <p class="text-muted">اختر مظهراً لموقعك العام</p>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
              <button class="btn" data-theme="dark">داكن فاخر</button>
              <button class="btn" data-theme="minimal">حديث بسيط</button>
              <button class="btn" data-theme="classic">كلاسيكي</button>
              <button class="btn" data-theme="premium">أسود مميز</button>
            </div>
            <div class="form-group"><label>اللون الأساسي</label><input type="color" id="onbPrimary" value="${onboardingData.theme?.primary||'#6c8cff'}" /></div>
            <div class="form-group"><label>اللون الثانوي</label><input type="color" id="onbSecondary" value="${onboardingData.theme?.secondary||'#1a1f27'}" /></div>
          `;
          break;
      }
      html += `
        <div style="display:flex;justify-content:space-between;margin-top:20px;">
          <button class="btn" id="onbPrev" ${onboardingIndex===0?'disabled':''}>السابق</button>
          <button class="btn btn-primary" id="onbNext">${onboardingIndex===onboardingSteps.length-1?'إنهاء':'التالي'}</button>
        </div>
      `;
      container.innerHTML = html;

      // ─── ربط الأحداث ───
      document.getElementById('onbNext').addEventListener('click', () => {
        // جمع بيانات الخطوة الحالية
        collectOnboardingData(step.id);
        if (onboardingIndex === onboardingSteps.length - 1) {
          finishOnboarding();
        } else {
          onboardingIndex++;
          renderOnboarding();
        }
      });

      const prevBtn = document.getElementById('onbPrev');
      if (prevBtn) {
        prevBtn.addEventListener('click', () => {
          // حفظ البيانات قبل الرجوع
          collectOnboardingData(step.id);
          onboardingIndex--;
          renderOnboarding();
        });
      }

      // معالجة خاصة لكل خطوة
      handleOnboardingStep(step.id);
    }

    // ─── جمع البيانات ───
    function collectOnboardingData(stepId) {
      switch (stepId) {
        case 'info':
          onboardingData.name = $('#onbName')?.value.trim() || '';
          onboardingData.description = $('#onbDesc')?.value.trim() || '';
          onboardingData.phone = $('#onbPhone')?.value.trim() || '';
          onboardingData.country = $('#onbCountry')?.value.trim() || '';
          onboardingData.currency = $('#onbCurrency')?.value || 'USD';
          onboardingData.timezone = $('#onbTz')?.value.trim() || 'Africa/Cairo';
          break;
        case 'logo':
          // الصورة ترفع بشكل منفصل
          break;
        case 'cover':
          break;
        case 'services':
          // تم جمعها عبر الأزرار
          break;
        case 'hours':
          // تجمع عند finish
          break;
        case 'barbers':
          break;
        case 'gallery':
          break;
        case 'whatsapp':
          onboardingData.whatsapp = $('#onbWhatsapp')?.value.trim() || '';
          break;
        case 'location':
          onboardingData.address = $('#onbAddress')?.value.trim() || '';
          break;
        case 'theme':
          onboardingData.theme = {
            primary: $('#onbPrimary')?.value || '#6c8cff',
            secondary: $('#onbSecondary')?.value || '#1a1f27'
          };
          break;
      }
    }

    // ─── معالجة الخطوات التفاعلية ───
    function handleOnboardingStep(stepId) {
      if (stepId === 'services') {
        if (!onboardingData.services) onboardingData.services = [];
        renderOnbServices();
        document.getElementById('onbAddService').addEventListener('click', () => {
          const name = $('#onbServiceName').value.trim();
          const price = parseFloat($('#onbServicePrice').value);
          const duration = parseInt($('#onbServiceDuration').value);
          if (!name || isNaN(price) || isNaN(duration)) { showToast('املأ جميع الحقول', 'error'); return; }
          onboardingData.services.push({ name, price, duration });
          $('#onbServiceName').value = '';
          $('#onbServicePrice').value = '';
          $('#onbServiceDuration').value = '';
          renderOnbServices();
        });
      }
      if (stepId === 'barbers') {
        if (!onboardingData.barbers) onboardingData.barbers = [];
        renderOnbBarbers();
        document.getElementById('onbAddBarber').addEventListener('click', () => {
          const name = $('#onbBarberName').value.trim();
          const phone = $('#onbBarberPhone').value.trim();
          const bio = $('#onbBarberBio').value.trim();
          if (!name) { showToast('الاسم مطلوب', 'error'); return; }
          onboardingData.barbers.push({ name, phone, bio });
          $('#onbBarberName').value = '';
          $('#onbBarberPhone').value = '';
          $('#onbBarberBio').value = '';
          renderOnbBarbers();
        });
      }
      if (stepId === 'hours') {
        const days = ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'];
        let html = '';
        days.forEach(d => {
          const saved = onboardingData.hours?.[d] || { enabled: true, open: '09:00', close: '21:00' };
          html += `
            <div class="flex" style="margin-bottom:8px;">
              <span style="width:80px;">${d}</span>
              <input type="checkbox" id="hour_${d}_enabled" ${saved.enabled?'checked':''} />
              <label>مفتوح</label>
              <input type="time" id="hour_${d}_open" value="${saved.open||'09:00'}" />
              <input type="time" id="hour_${d}_close" value="${saved.close||'21:00'}" />
            </div>
          `;
        });
        document.getElementById('onbHoursContainer').innerHTML = html;
        // حفظ الساعات عند الضغط على التالي أو finish
        // سيتم جمعها في collectOnboardingData ولكننا نضيف مستمع لحفظها فوراً
        days.forEach(d => {
          document.getElementById(`hour_${d}_enabled`).addEventListener('change', () => {
            if (!onboardingData.hours) onboardingData.hours = {};
            onboardingData.hours[d] = {
              enabled: document.getElementById(`hour_${d}_enabled`).checked,
              open: document.getElementById(`hour_${d}_open`).value,
              close: document.getElementById(`hour_${d}_close`).value
            };
          });
          document.getElementById(`hour_${d}_open`).addEventListener('change', () => {
            if (!onboardingData.hours) onboardingData.hours = {};
            onboardingData.hours[d] = {
              enabled: document.getElementById(`hour_${d}_enabled`).checked,
              open: document.getElementById(`hour_${d}_open`).value,
              close: document.getElementById(`hour_${d}_close`).value
            };
          });
          document.getElementById(`hour_${d}_close`).addEventListener('change', () => {
            if (!onboardingData.hours) onboardingData.hours = {};
            onboardingData.hours[d] = {
              enabled: document.getElementById(`hour_${d}_enabled`).checked,
              open: document.getElementById(`hour_${d}_open`).value,
              close: document.getElementById(`hour_${d}_close`).value
            };
          });
        });
      }
      if (stepId === 'logo') {
        document.getElementById('onbLogo').addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          try {
            const result = await uploadToCloudinary(file);
            onboardingData.logoUrl = result.url;
            onboardingData.logoPublicId = result.publicId;
            document.getElementById('onbLogoPreview').innerHTML = `<img src="${result.url}" style="max-width:120px;border-radius:8px;" />`;
          } catch (err) { showToast('فشل الرفع: '+err.message, 'error'); }
        });
      }
      if (stepId === 'cover') {
        document.getElementById('onbCover').addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          try {
            const result = await uploadToCloudinary(file);
            onboardingData.coverUrl = result.url;
            onboardingData.coverPublicId = result.publicId;
            document.getElementById('onbCoverPreview').innerHTML = `<img src="${result.url}" style="max-width:200px;border-radius:8px;" />`;
          } catch (err) { showToast('فشل الرفع: '+err.message, 'error'); }
        });
      }
      if (stepId === 'gallery') {
        onboardingData.gallery = onboardingData.gallery || [];
        document.getElementById('onbGallery').addEventListener('change', async (e) => {
          const files = e.target.files;
          for (const file of files) {
            try {
              const result = await uploadToCloudinary(file);
              onboardingData.gallery.push({ url: result.url, publicId: result.publicId });
              const preview = document.getElementById('onbGalleryPreview');
              const img = document.createElement('img');
              img.src = result.url;
              img.style.maxWidth = '80px';
              img.style.borderRadius = '8px';
              preview.appendChild(img);
            } catch (err) { showToast('فشل الرفع: '+err.message, 'error'); }
          }
        });
      }
      if (stepId === 'location') {
        document.getElementById('onbGetLocation').addEventListener('click', () => {
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                onboardingData.location = { latitude: pos.coords.latitude, longitude: pos.coords.longitude };
                document.getElementById('onbLocationResult').textContent = `📍 ${pos.coords.latitude}, ${pos.coords.longitude}`;
              },
              () => { showToast('تم رفض الوصول إلى الموقع', 'error'); }
            );
          } else {
            showToast('جهازك لا يدعم تحديد الموقع', 'error');
          }
        });
      }
      if (stepId === 'theme') {
        document.querySelectorAll('[data-theme]').forEach(btn => {
          btn.addEventListener('click', () => {
            const theme = btn.dataset.theme;
            const colors = {
              dark: { primary: '#6c8cff', secondary: '#1a1f27' },
              minimal: { primary: '#2d3436', secondary: '#dfe6e9' },
              classic: { primary: '#8e44ad', secondary: '#2c3e50' },
              premium: { primary: '#1a1a1a', secondary: '#f1c40f' }
            };
            const c = colors[theme] || colors.dark;
            document.getElementById('onbPrimary').value = c.primary;
            document.getElementById('onbSecondary').value = c.secondary;
            onboardingData.theme = c;
          });
        });
      }
    }

    function renderOnbServices() {
      const container = document.getElementById('onbServicesList');
      if (!container) return;
      if (!onboardingData.services || onboardingData.services.length === 0) {
        container.innerHTML = '<p class="text-muted">لم تضف أي خدمات بعد.</p>';
        return;
      }
      let html = '';
      onboardingData.services.forEach((s, i) => {
        html += `<div class="flex-between"><span>${s.name} - ${s.price} جنيه (${s.duration} دقيقة)</span><button class="btn btn-danger" data-idx="${i}">حذف</button></div>`;
      });
      container.innerHTML = html;
      container.querySelectorAll('[data-idx]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.idx);
          onboardingData.services.splice(idx, 1);
          renderOnbServices();
        });
      });
    }

    function renderOnbBarbers() {
      const container = document.getElementById('onbBarbersList');
      if (!container) return;
      if (!onboardingData.barbers || onboardingData.barbers.length === 0) {
        container.innerHTML = '<p class="text-muted">لم تضف أي حلاقين بعد.</p>';
        return;
      }
      let html = '';
      onboardingData.barbers.forEach((b, i) => {
        html += `<div class="flex-between"><span>${b.name} ${b.phone ? '📞'+b.phone : ''}</span><button class="btn btn-danger" data-idx="${i}">حذف</button></div>`;
      });
      container.innerHTML = html;
      container.querySelectorAll('[data-idx]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.idx);
          onboardingData.barbers.splice(idx, 1);
          renderOnbBarbers();
        });
      });
    }

    // ─── دالة إنهاء الإعداد ───
    async function finishOnboarding() {
      console.log('🚀 بدء إنشاء المتجر...');

      // جمع بيانات ساعات العمل من الحقول الحالية
      const days = ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'];
      if (!onboardingData.hours) onboardingData.hours = {};
      days.forEach(d => {
        const enabled = document.getElementById(`hour_${d}_enabled`)?.checked ?? true;
        const open = document.getElementById(`hour_${d}_open`)?.value || '09:00';
        const close = document.getElementById(`hour_${d}_close`)?.value || '21:00';
        onboardingData.hours[d] = { enabled, open, close };
      });

      // التحقق من اسم المتجر
      const name = onboardingData.name;
      if (!name) {
        showToast('⚠️ اسم المتجر مطلوب!', 'error');
        return;
      }

      // إنشاء slug فريد
      let slug = generateSlug(name);
      const q = query(collection(db, 'shops'), where('slug', '==', slug));
      const snap = await getDocs(q);
      if (!snap.empty) {
        slug = `${slug}-${Date.now().toString().slice(-4)}`;
      }

      // تجهيز بيانات المتجر
      const shopData = {
        ownerId: currentUser.uid,
        name: name,
        slug: slug,
        description: onboardingData.description || '',
        logoUrl: onboardingData.logoUrl || '',
        logoPublicId: onboardingData.logoPublicId || '',
        coverUrl: onboardingData.coverUrl || '',
        coverPublicId: onboardingData.coverPublicId || '',
        phone: onboardingData.phone || '',
        whatsapp: onboardingData.whatsapp || '',
        address: onboardingData.address || '',
        location: onboardingData.location || null,
        country: onboardingData.country || '',
        currency: onboardingData.currency || 'USD',
        timezone: onboardingData.timezone || 'Africa/Cairo',
        theme: onboardingData.theme || { primary: '#6c8cff', secondary: '#1a1f27' },
        status: 'draft',
        planId: '',
        subscriptionStatus: 'pending',
        paymentStatus: 'pending',
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      };

      try {
        // 1. إنشاء المتجر
        const shopRef = await addDoc(collection(db, 'shops'), shopData);
        currentShopId = shopRef.id;
        console.log('✅ تم إنشاء المتجر:', shopRef.id);

        // 2. تحديث وثيقة المستخدم
        await updateDoc(doc(db, 'users', currentUser.uid), { shopId: shopRef.id });

        // 3. إضافة الخدمات
        if (onboardingData.services && onboardingData.services.length > 0) {
          const batch = writeBatch(db);
          onboardingData.services.forEach(s => {
            const ref = doc(collection(db, 'shops', shopRef.id, 'services'));
            batch.set(ref, {
              name: s.name,
              price: s.price,
              duration: s.duration,
              description: '',
              active: true,
              createdAt: serverTimestamp(),
              updatedAt: serverTimestamp()
            });
          });
          await batch.commit();
          console.log('✅ تم إضافة الخدمات');
        }

        // 4. إضافة الحلاقين
        if (onboardingData.barbers && onboardingData.barbers.length > 0) {
          const batch = writeBatch(db);
          onboardingData.barbers.forEach(b => {
            const ref = doc(collection(db, 'shops', shopRef.id, 'barbers'));
            batch.set(ref, {
              name: b.name,
              phone: b.phone || '',
              bio: b.bio || '',
              active: true,
              createdAt: serverTimestamp(),
              updatedAt: serverTimestamp()

            openTime: h.open,

        // 6. إضافة معرض الصور

              createdAt: serverTimestamp(),

        // 7. تسجيل نشاط
        await addDoc(collection(db, 'activityLogs'), {

          actorRole: 'shop_owner',

        const shopSnap = await getDoc(doc(db, 'shops', shopRef.id));
        currentShop = { id: shopSnap.id, ...shopSnap.data() };

        // التوجيه إلى لوحة التحكم
        switchPage('page-dashboard');
        renderDashboard();

    // DASHBOARD (نفس الكود السابق - تم اختصاره هنا)
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    function renderDashboard() {
      if (!currentShop) return;
      $('#dashboardShopName').textContent = currentShop.name || 'متجري';
      const status = currentShop.status || 'draft';
      const badge = $('#shopStatusBadge');
      badge.textContent = status === 'active' ? 'نشط' : status === 'pending' ? 'قيد المراجعة' : status === 'suspended' ? 'موقوف' :

      document.querySelectorAll('#dashboardNav a').forEach(a => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          document.querySelectorAll('#dashboardNav a').forEach(el => el.classList.remove('active'));
          a.classList.add('active');
          activeSection = a.dataset.section;
          renderSection(activeSection);

    function renderSection(section) {
      const container = $('#dashboardContent');
      container.innerHTML = `<div class="text-center text-muted" style="padding:40px;">جارٍ التحميل...</div>`;

        case 'overview':
          renderOverview(container);
          break;
        case 'services':
          renderServices(container);
          break;
        case 'barbers':
          renderBarbers(container);
          break;
        case 'bookings':
          renderBookings(container);
          break;

          renderCustomers(container);
          break;
        case 'reviews':

          break;

          renderGallery(container);
          break;
        case 'hours':
          renderHours(container);
          break;

          renderHolidays(container);
          break;

          renderSubscription(container);
          break;

          renderQR(container);
          break;

          renderSettings(container);
          break;

    // ─── OVERVIEW ───
    async function renderOverview(container) {
      const shopId = currentShopId;
      const servicesSnap = await getDocs(collection(db, 'shops', shopId, 'services'));
      const barbersSnap = await getDocs(collection(db, 'shops', shopId, 'barbers'));
      const bookingsSnap = await getDocs(collection(db, 'shops', shopId, 'bookings'));
      const customersSnap = await getDocs(collection(db, 'shops', shopId, 'customers'));
      const reviewsSnap = await getDocs(collection(db, 'shops', shopId, 'reviews'));

      const today = new Date();
      today.setHours(0,0,0,0);
      const todayBookings = bookingsSnap.docs.filter(d => {
        const date = d.data().date?.toDate?.() || new Date(d.data().date);
        return date >= today;
      });
      const pending = todayBookings.filter(d => d.data().status === 'pending').length;
      const confirmed = todayBookings.filter(d => d.data().status === 'confirmed').length;
      const completed = todayBookings.filter(d => d.data().status === 'completed').length;
      const cancelled = todayBookings.filter(d => d.data().status === 'cancelled').length;

      let avgRating = 0;
      const reviews = reviewsSnap.docs.map(d => d.data());
      if (reviews.length) {
        const sum = reviews.reduce((acc, r) => acc + (r.rating||0), 0);
        avgRating = sum / reviews.length;
      }

      container.innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-bottom:20px;">
          <div class="card"><div class="text-muted">حجوزات اليوم</div><div style="font-size:28px;font-weight:700;">${todayBookings.length}</div></div>
          <div class="card"><div class="text-muted">قيد الانتظار</div><div style="font-size:28px;font-weight:700;color:var(--orange);">${pending}</div></div>
          <div class="card"><div class="text-muted">مؤكدة</div><div style="font-size:28px;font-weight:700;color:var(--accent);">${confirmed}</div></div>
          <div class="card"><div class="text-muted">مكتملة</div><div style="font-size:28px;font-weight:700;color:var(--green);">${completed}</div></div>
          <div class="card"><div class="text-muted">ملغية</div><div style="font-size:28px;font-weight:700;color:var(--red);">${cancelled}</div></div>
          <div class="card"><div class="text-muted">إجمالي العملاء</div><div style="font-size:28px;font-weight:700;">${customersSnap.size}</div></div>
          <div class="card"><div class="text-muted">عدد الخدمات</div><div style="font-size:28px;font-weight:700;">${servicesSnap.size}</div></div>
          <div class="card"><div class="text-muted">متوسط التقييم</div><div style="font-size:28px;font-weight:700;">${avgRating.toFixed(1)} ★</div></div>
        </div>
        <div class="card">
          <div class="card-header"><h3>أحدث الحجوزات</h3></div>
          <div id="recentBookingsList"></div>
        </div>
      `;

      const recent = bookingsSnap.docs.sort((a,b) => (b.data().createdAt?.toMillis?.()||0) - (a.data().createdAt?.toMillis?.()||0)).slice(0,5);
      const list = container.querySelector('#recentBookingsList');
      if (recent.length === 0) {
        list.innerHTML = '<p class="text-muted">لا توجد حجوزات بعد.</p>';
      } else {
        let html = '<div class="table-wrap"><table><thead><tr><th>العميل</th><th>الخدمة</th><th>التاريخ</th><th>الحالة</th></tr></thead><tbody>';
        recent.forEach(d => {
          const data = d.data();
          html += `<tr><td>${data.customerName||'غير معروف'}</td><td>${data.serviceName||'غير معروف'}</td><td>${formatDate(data.date)} ${formatTime(data.date)}</td><td><span class="badge badge-${data.status||'pending'}">${data.status||'قيد الانتظار'}</span></td></tr>`;
        });
        html += '</tbody></table></div>';
        list.innerHTML = html;
      }
    }

    async function loadHours() {
      const container = document.getElementById('hoursForm');
      if (!container) return;
      const days = ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'];
      let html = '';
      for (const d of days) {
        const docRef = doc(db, 'shops', currentShopId, 'workingHours', d);
        const snap = await getDoc(docRef);
        const data = snap.exists() ? snap.data() : { enabled: true, openTime: '09:00', closeTime: '21:00' };
        html += `
          <div class="flex" style="margin-bottom:8px;">
            <span style="width:80px;">${d}</span>
            <input type="checkbox" id="hour_${d}_enabled" ${data.enabled?'checked':''} />
            <label>مفتوح</label>
            <input type="time" id="hour_${d}_open" value="${data.openTime||'09:00'}" />
            <input type="time" id="hour_${d}_close" value="${data.closeTime||'21:00'}" />
          </div>
        `;
      }
      container.innerHTML = html;
      document.getElementById('saveHours').addEventListener('click', async () => {
        const batch = writeBatch(db);
        for (const d of days) {
          const ref = doc(db, 'shops', currentShopId, 'workingHours', d);
          const enabled = document.getElementById(`hour_${d}_enabled`).checked;
          const open = document.getElementById(`hour_${d}_open`).value;
          const close = document.getElementById(`hour_${d}_close`).value;
          batch.set(ref, { enabled, openTime: open, closeTime: close, breaks: [] }, { merge: true });
        }
        await batch.commit();
        showToast('تم حفظ ساعات العمل', 'success');
      });
    }

    async function renderPublicShop(slug) {
      const container = document.getElementById('publicContent');
      container.innerHTML = '<div style="text-align:center;padding:40px;"><i class="fas fa-spinner fa-spin"></i> جارٍ التحميل...</div>';

          return;
        }
        const shop = { id: snap.docs[0].id, ...snap.docs[0].data() };
        if (shop.status !== 'active' || shop.subscriptionStatus !== 'active') {
          container.innerHTML = `<div style="text-align:center;padding:40px;"><h2>هذا المتجر غير متاح حالياً</h2><p class="text-muted">يرجى المحاولة لاحقاً.</p></div>`;
          return;
        }
        // جلب البيانات
        const servicesSnap = await getDocs(collection(db, 'shops', shop.id, 'services'));
        const services = servicesSnap.docs.map(d => d.data());
        const barbersSnap = await getDocs(collection(db, 'shops', shop.id, 'barbers'));
        const barbers = barbersSnap.docs.map(d => d.data());
        const gallerySnap = await getDocs(collection(db, 'shops', shop.id, 'gallery'));
        const gallery = gallerySnap.docs.map(d => d.data());
        const reviewsSnap = await getDocs(collection(db, 'shops', shop.id, 'reviews'));
        const reviews = reviewsSnap.docs.map(d => d.data()).filter(r => r.status === 'approved');
        const hours = {};
        const days = ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'];
        for (const d of days) {
          const docRef = doc(db, 'shops', shop.id, 'workingHours', d);
          const snap = await getDoc(docRef);
          if (snap.exists()) hours[d] = snap.data();
        }

        let html = `
          <div class="shop-hero">
            ${shop.logoUrl ? `<img src="${shop.logoUrl}" alt="Logo" />` : ''}
            <h1>${shop.name}</h1>
            <p>${shop.description||''}</p>
            ${shop.phone ? `<p><i class="fas fa-phone"></i> ${shop.phone}</p>` : ''}
            ${shop.whatsapp ? `<p><i class="fab fa-whatsapp"></i> <a href="https://wa.me/${shop.whatsapp.replace(/\D/g,'')}" target="_blank">تواصل عبر واتساب</a></p>` : ''}
          </div>
          <div style="max-width:700px;margin:0 auto;">
            <h3>خدماتنا</h3>
            ${services.map(s => `<div class="service-card"><div class="flex-between"><span><strong>${s.name}</strong></span><span class="price">${shop.currency||'$'}${s.price}</span></div><div class="text-muted">${s.duration||0} دقيقة</div></div>`).join('')}
            <h3>الحلاقون</h3>
            ${barbers.filter(b=>b.active).map(b => `<div class="barber-card"><strong>${b.name}</strong><p>${b.bio||''}</p></div>`).join('')}
            <h3>التقييمات</h3>
            ${reviews.map(r => `<div><strong>${r.customerName||'مجهول'}</strong> ${'★'.repeat(r.rating||0)}<p>${r.review||''}</p></div>`).join('')}
            <h3>ساعات العمل</h3>
            ${days.map(d => `<div class="flex-between"><span>${d}</span><span>${hours[d]?.enabled ? (hours[d].openTime + ' - ' + hours[d].closeTime) : 'مغلق'}</span></div>`).join('')}
            <h3>احجز موعداً</h3>
            <div class="booking-form">
              <div class="form-group"><label>الخدمة</label><select id="bookService">${services.map((s,i) => `<option value="${i}">${s.name} - ${shop.currency}${s.price}</option>`).join('')}</select></div>

          const bookingDateTime = new Date(`${date}T${time}`);
          if (isNaN(bookingDateTime.getTime())) {
            showToast('تاريخ/وقت غير صحيح', 'error');
            return;
          }
          try {
            await runTransaction(db, async (transaction) => {
              const start = Timestamp.fromDate(bookingDateTime);
              const end = Timestamp.fromDate(new Date(bookingDateTime.getTime() + (service.duration||30)*60000));
              const q = query(
                collection(db, 'shops', shop.id, 'bookings'),
                where('date', '>=', start),
                where('date', '<', end),
                where('barberId', '==', barberId || '')
              );
              const snap = await getDocs(q);
              if (!snap.empty) {
                throw new Error('هذا الموعد محجوز بالفعل. يرجى اختيار وقت آخر.');
              }
              const holidayQ = query(collection(db, 'shops', shop.id, 'holidays'), where('date', '==', start));
              const holidaySnap = await getDocs(holidayQ);
              if (!holidaySnap.empty) {
                throw new Error('هذا التاريخ عطلة رسمية.');
              }
              const bookingRef = doc(collection(db, 'shops', shop.id, 'bookings'));
              transaction.set(bookingRef, {
                shopId: shop.id,
                customerName: name,
                customerPhone: phone,
                customerEmail: email || '',
                serviceId: service.id,
                serviceName: service.name,
                barberId: barberId || '',
                barberName: barbers.find(b => b.id === barberId)?.name || '',
                date: start,
                startTime: time,
                endTime: new Date(bookingDateTime.getTime() + (service.duration||30)*60000).toTimeString().slice(0,5),
                price: service.price,
                currency: shop.currency || 'USD',
                status: 'pending',
                notes: '',
                createdAt: serverTimestamp(),
                updatedAt: serverTimestamp()
              });
              const custQ = query(collection(db, 'shops', shop.id, 'customers'), where('phone', '==', phone));
              const custSnap = await getDocs(custQ);
              if (custSnap.empty) {
                const customerRef = doc(collection(db, 'shops', shop.id, 'customers'));
                transaction.set(customerRef, {
                  name, phone, email: email || '',
                  bookingCount: 1,
                  lastBookingAt: start,
                  createdAt: serverTimestamp(),
                  updatedAt: serverTimestamp()
                });
              } else {
                const custDoc = custSnap.docs[0];
                transaction.update(custDoc.ref, {
                  bookingCount: increment(1),
                  lastBookingAt: start,
                  updatedAt: serverTimestamp()
                });
              }
            });
            showToast('✅ تم تأكيد الحجز!', 'success');
          } catch (e) {
            showToast(e.message || 'فشل الحجز', 'error');
          }
        });
      } catch (e) {
        container.innerHTML = `<div style="text-align:center;padding:40px;"><h2>خطأ في تحميل المتجر</h2><p class="text-muted">${e.message}</p></div>`;
      }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // ROUTE HANDLER
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function handleRoute() {
      const path = window.location.pathname;
      if (path.startsWith('/s/')) {
        loadPublicShop();
        return;
      }
      if (currentUser) {
        if (currentRole === 'shop_owner') {
          if (!currentShopId) {
            switchPage('page-onboarding');
            renderOnboarding();
          } else {
            switchPage('page-dashboard');
            renderDashboard();
          }
        } else {
          switchPage('page-login');
        }
      } else {
        switchPage('page-login');
      }
    }

    // ─── INIT ───
    window.addEventListener('popstate', handleRoute);
    setTimeout(handleRoute, 500);

    window.currentShopId = () => currentShopId;
    window.currentShop = () => currentShop;
    window.db = db;
    window.auth = auth;

    console.log('🚀 BarberSaaS جاهز.');
  </script>
</body>
</html>
